<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.E.C للمقاولات العامة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo for Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f3f4f6;
        }
        .btn-hover-effect {
            transition: all 0.3s ease;
        }
        .btn-hover-effect:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center pb-12">

    <!-- Main Card Container -->
    <div class="w-full max-w-md mx-auto bg-white shadow-2xl overflow-hidden sm:rounded-2xl sm:mt-10">
        
        <!-- Video Header -->
        <div class="relative h-64 sm:h-80 w-full overflow-hidden">
            <!-- Google Drive Embedded Video -->
            <iframe 
                src="https://drive.google.com/file/d/1T0IrO-O1kjh33Zr1VSJzfVsrfzwhHHRy/preview?autoplay=1&amp;mute=1" 
                class="absolute top-0 left-0 w-full h-full border-0 object-cover" 
                title="S.E.C company video"
                allow="autoplay; fullscreen"
                allowfullscreen>
            </iframe>
            <!-- Overlay to make it look elegant -->
            <div class="absolute inset-0 bg-slate-900 bg-opacity-20 pointer-events-none"></div>
        </div>

        <!-- Content Section -->
        <div class="px-6 py-8 flex flex-col items-center -mt-16 relative z-10">
            
            <!-- Logo Box -->
            <div class="bg-white p-4 rounded-2xl shadow-lg mb-6 border-4 border-white flex justify-center items-center">
                <!-- LOGO IS INSERTED HERE -->
                <img src="151879.jpg" alt="S.E.C Logo" class="w-32 h-auto object-contain">
            </div>

            <!-- Title & Description -->
            <h1 class="text-2xl font-bold text-slate-800 mb-2 text-center">S.E.C للمقاولات العامة</h1>
            <p class="text-slate-500 text-center mb-8 text-sm px-4">نبني المستقبل بعراقة الماضي</p>

            <!-- Buttons Grid -->
            <div class="w-full space-y-4">
                
                <!-- WhatsApp Button -->
                <a href="https://wa.me/9647811112207" target="_blank" class="btn-hover-effect flex items-center justify-between w-full bg-[#25D366] text-white px-6 py-4 rounded-xl font-bold text-lg">
                    <span class="flex items-center gap-3">
                        <i class="fa-brands fa-whatsapp text-2xl"></i>
                        واتساب
                    </span>
                    <i class="fa-solid fa-chevron-left text-sm opacity-70"></i>
                </a>

                <!-- Facebook Button -->
                <a href="https://www.facebook.com/share/1CGGAe1jrX/?locale=en_US" target="_blank" class="btn-hover-effect flex items-center justify-between w-full bg-[#1877F2] text-white px-6 py-4 rounded-xl font-bold text-lg">
                    <span class="flex items-center gap-3">
                        <i class="fa-brands fa-facebook-f text-2xl w-6 text-center"></i>
                        فيسبوك
                    </span>
                    <i class="fa-solid fa-chevron-left text-sm opacity-70"></i>
                </a>

                <!-- TikTok Button -->
                <a href="#" target="_blank" class="btn-hover-effect flex items-center justify-between w-full bg-black text-white px-6 py-4 rounded-xl font-bold text-lg">
                    <span class="flex items-center gap-3">
                        <i class="fa-brands fa-tiktok text-2xl w-6 text-center"></i>
                        تيك توك
                    </span>
                    <i class="fa-solid fa-chevron-left text-sm opacity-70"></i>
                </a>

                <!-- Company Profile PDF Button -->
                <a href="#" download class="btn-hover-effect flex items-center justify-between w-full bg-slate-800 text-white px-6 py-4 rounded-xl font-bold text-lg mt-6 border-2 border-slate-800 hover:bg-white hover:text-slate-800">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-file-pdf text-2xl w-6 text-center"></i>
                        ملف الشركة (PDF)
                    </span>
                    <i class="fa-solid fa-download text-sm opacity-70"></i>
                </a>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-slate-400 text-sm font-semibold">
        © 2026 S.E.C للمقاولات العامة. جميع الحقوق محفوظة.
    </div>

</body>
</html>
